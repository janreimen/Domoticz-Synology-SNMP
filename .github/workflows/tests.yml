name: tests

on:
  push:
  pull_request:

# The tests never need to write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SNMP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends snmp snmpd
          sudo systemctl stop snmpd || true

      - name: Run tests
        run: python -m unittest discover -s tests -v

  # Python 3.7 and 3.8 use Debian Bullseye containers.
  # Bullseye has moved to the Debian archive, so configure archived
  # repositories explicitly before installing the SNMP test tools.
  old-python:
    name: Python ${{ matrix.python-version }} (container)
    runs-on: ubuntu-latest
    container:
      image: python:${{ matrix.python-version }}-slim-bullseye

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8"]

    steps:
      - uses: actions/checkout@v4

      - name: Configure archived Debian Bullseye repositories
        run: |
          set -eu

          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            > /etc/apt/sources.list

          rm -f /etc/apt/sources.list.d/*

          apt-get \
            -o Acquire::Check-Valid-Until=false \
            update

      - name: Install SNMP tools
        run: |
          apt-get install -y --no-install-recommends snmp snmpd

      - name: Show Python and SNMP versions
        run: |
          python --version
          snmpget --version
          snmpd --version

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint and compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 vermin

      - name: pyflakes checks (Domoticz injects Parameters, Devices, Images)
        run: |
          python -m flake8 \
            --select=F \
            --builtins=Parameters,Devices,Images \
            plugin.py synoSNMP tests tools

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck deploy.sh tools/*.sh

      - name: Code must stay Python 3.7 compatible
        run: |
          vermin --target=3.7- --no-tips --violations -q \
            plugin.py synoSNMP

      - name: Verify repository version consistency
        run: python -m unittest tests.test_repo -v

