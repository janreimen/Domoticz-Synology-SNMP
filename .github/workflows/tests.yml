name: tests

on:
  push:
  pull_request:

# The tests never need to write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: net-snmp client tools and snmpd (for the end-to-end tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y snmp snmpd
          sudo systemctl stop snmpd || true
      - name: Tests
        run: python -m unittest discover -s tests -v

  # Domoticz hosts often run an old Python (Debian 10/11: 3.7/3.9).  `vermin` below only reads the code; this
  # job really runs the whole suite, including the end-to-end tests against a real snmpd, on the oldest versions
  # the plugin claims to support.
  old-python:
    name: Python ${{ matrix.python-version }} (container)
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}-slim-bullseye
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8"]
    steps:
      - uses: actions/checkout@v4
      - name: net-snmp client tools and snmpd (for the end-to-end tests)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends snmp snmpd
      - name: Tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 vermin
      - name: pyflakes checks (Domoticz injects Parameters, Devices, Images)
        run: python -m flake8 --select=F --builtins=Parameters,Devices,Images plugin.py synoSNMP tests tools
      - name: shellcheck
        run: shellcheck deploy.sh tools/*.sh
      - name: Code must stay Python 3.7 compatible (Domoticz hosts run old Pythons)
        run: vermin --target=3.7- --no-tips --violations -q plugin.py synoSNMP
